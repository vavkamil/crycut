[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crycut"
version = "0.1.0"
description = "Print and cut StickerPix sheets directly from Linux"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "contourpy==1.3.3",     # Trace shape boundaries into cut outlines
    "cryptography==46.0.5", # AES encryption for printer communication
    "numpy==2.3.5",         # Pixel masks and cut-path geometry calculations
    "pillow==12.1.1",       # Image loading, rendering, JPEG export, and previews
    "rich==15.0.0",         # Terminal layouts, colors, and live progress
    "scipy==1.16.3",        # Shape detection, hole filling, and border expansion
]

[project.scripts]
crycut = "crycut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[dependency-groups]
test = [
    "pytest==9.1.1", # Test runner; existing unittest tests remain supported
]
lint = [
    "ruff==0.17.1",  # Python linter and formatter
]
typecheck = [
    "ty==0.0.89",    # Python type checker
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.src]
include = ["src"]
exclude = ["tests/", "build/", "dist/", "**/*.egg-info/"]

[tool.ruff]
extend-exclude = [".cache", "work", "build", "dist", "*.egg-info", "research"]
force-exclude = true

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "ANN001", # Missing function argument annotations
    "ANN201", # Missing public return annotations
    "ARG",    # Unused arguments
    "B",      # Subtle bug patterns
    "D",      # Docstrings
    "E",      # Conventional Python style
    "F",      # Probable mistakes
    "I",      # Import organization
    "PIE",    # Correctness and cleanup
    "RUF",    # Ruff-specific rules
    "SIM",    # Simplification
    "T20",    # Print statements
    "TD",     # TODO comments
    "UP",     # Modern Python syntax
    "W",      # Style warnings
]
ignore = [
    "E501",  # Line too long
    "TD003", # Missing issue link for TODO
    "D203",  # No blank line before class docstrings
    "D212",  # Multiline summaries start after opening quotes
]
exclude = ["tests/**"]

[tool.ruff.lint.per-file-ignores]
# Command entry points and the display module own terminal output.
"src/crycut/{cli,progress}.py" = ["T20"]
"src/crycut/commands/*.py" = ["T20"]

[tool.ruff.format]
docstring-code-format = true
