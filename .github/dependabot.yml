# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Prague"
    assignees:
      - "vavkamil"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Prague"
    assignees:
      - "vavkamil"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 14
